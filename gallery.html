         .containergal {
            width: 90%;
            margin: 2rem auto;
        }
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(250px, 1fr));
            grid-auto-rows: 10px; 
            grid-gap: 15px;
            grid-auto-flow: dense; /*заполняет пустые места*/
        }
        .image-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
           
        }
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            
            transition: transform 0.3s ease;
        }
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(57, 57, 57, 0.7);
            top: 0;
            left: 0;
            transform: scale(0);
            transition: all 0.3s ease;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            opacity:0;
        }
        .image-item:hover .overlay {
            transform: scale(1.1);
            opacity: 1;
        }
        sort{
              font-family: "Comforter Brush", cursive;
              font-weight: 400;
                
                font-size: 100px;
              text-align: center;
              margin-bottom: 1rem;
            }
         .hearts{
          position: absolute;
          right:15px;
          bottom:15px;
          z-index: 10;
          width: 36px;
          height: 33px;

         }
         .heart{
          display:block;
          width:100%;
          height: 100%;
          object-fit: contain;
          cursor:pointer;
          padding:4px;
          /*
          transition: transform 0.2s ease;*/
          
         
         }
         .heart:active{
          transform: scale(1.1);
         }

         
        
        @media (max-width: 768px) {
            .image-gallery {
                grid-template-columns: repeat(auto-fill,minmax(100px, 1fr));
                grid-auto-rows: 10px;
            }
           
            .sort{
                font-size: 50px;
               
            }
            #fixedCartIcon {
                top: 550px !important; 
            }
            .sortcont {
              display: flex;
              align-items: center;
              
              gap: 1px;
          }

          .headgal {
              flex-direction: column;
              align-items: flex-start;
              gap: 20px;
              padding: 20px;
          }
          
          .sortcont {
              flex-direction: column;
              width: 100%;
              gap: 15px;
          }
          
          .price-filter {
              width: 100%;
              flex-direction: column;
              gap: 15px;
          }
          
          .filter-inputs {
              flex-direction: row;
              width: 100%;
          }
          
          .filter-inputs input {
              width: 100% !important;
          }
    
          .filter-buttons {
              flex-direction: column;
              width: 100%;
          }
          
          .filter-btn {
              width: 100%;
              margin: 5px 0;
          }

          .headgal img[usemap="#strel"] {
              position: fixed; 
              top: 10px;
              left: 10px;
              z-index: 1000; 
              width: 50px;
              height: 50px;
              border-radius: 50%;
              padding: 8px;
          }       
}

        

        .medium {

        .small {

        }
        .tall {
            grid-row: span 20;
        }

        .sortcont {
        flex-wrap: nowrap;
        justify-content: flex-start;
    }
